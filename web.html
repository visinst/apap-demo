<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The 4th Anyang Public Art Project — Website</title>
  <!-- Saved to the home screen on iPhone/iPad: open full screen, without the browser's address bar. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="APAP Web">
  <link rel="stylesheet" href="carousel.css">
</head>
<body>
  <div class="carousel" id="carousel"></div>
  <script src="carousel.js"></script>
  <script>
    // The two archived pages, shown live. Autoplay scrolls each one to its
    // end before flipping to the next.
    startCarousel(document.getElementById('carousel'), [
      { page: 'site/home.html' },
      // Second page: hold at the top for a long time before scrolling down.
      { page: 'site/catalogue.html', startMs: 10000 },
    ], { scroll: true });
  </script>
</body>
</html>
